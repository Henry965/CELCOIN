<!DOCTYPE html>
<html>
<head>
<title>CELCOIN</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
*{font-family:'Segoe UI', Arial; box-sizing:border-box}
body{background:#f7f8fa; display:flex; justify-content:center; align-items:center; height:100vh; margin:0}
.box{background:#fff; padding:30px; border-radius:15px; width:90%; max-width:400px; box-shadow:0 4px 20px rgba(0,0,0,0.1)}
h1{text-align:center; font-style:italic}
.cel{color:#6b7280} .coin{color:#00bfa5}
input{width:100%; padding:14px; margin:10px 0; border:1px solid #ddd; border-radius:8px}
.btn{width:100%; padding:14px; background:#00bfa5; color:#fff; border:none; border-radius:10px; font-weight:bold; cursor:pointer; margin-top:10px}
.tabs{display:flex; margin-bottom:20px}
.tab{flex:1; padding:10px; background:#eee; border:none; cursor:pointer}
.tab.active{background:#00bfa5; color:#fff}
</style>
</head>
<body>

<div class="box">
  <h1><span class="cel">CEL</span><span class="coin">COIN</span></h1>
  
  <div class="tabs">
    <button class="tab active" onclick="showTab('login')">Login</button>
    <button class="tab" onclick="showTab('register')">Register</button>
  </div>

  <div id="loginForm">
    <input type="email" id="loginEmail" placeholder="Email">
    <input type="password" id="loginPassword" placeholder="Password">
    <button class="btn" onclick="login()">Login</button>
  </div>

  <div id="registerForm" style="display:none">
    <input type="text" id="regName" placeholder="Full Name">
    <input type="email" id="regEmail" placeholder="Email">
    <input type="password" id="regPassword" placeholder="Password">
    <input type="text" id="regRef" placeholder="Referral Email Optional">
    <button class="btn" onclick="register()">Register</button>
  </div>
</div>

<script>
// AUTO FILL REFERRAL FROM URL ?ref=
window.onload = function(){
  const urlParams = new URLSearchParams(window.location.search);
  const ref = urlParams.get('ref');
  if(ref){ document.getElementById('regRef').value = decodeURIComponent(ref); }
}

function showTab(tab){
  document.getElementById('loginForm').style.display = tab==='login'?'block':'none';
  document.getElementById('registerForm').style.display = tab==='register'?'block':'none';
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  event.target.classList.add('active');
}

function register(){
  let name = document.getElementById('regName').value;
  let email = document.getElementById('regEmail').value.toLowerCase();
  let password = document.getElementById('regPassword').value;
  let ref = document.getElementById('regRef').value.toLowerCase();
  
  if(!name || !email || !password) return alert('Fill all fields');
  
  let users = JSON.parse(localStorage.getItem('users')) || [];
  if(users.find(u=>u.email===email)) return alert('Email already exists');
  
  let newUser = {name, email, password, balance:100, referrals:0, referredBy:ref || ''};
  users.push(newUser);
  
  // Give 100 CEL to referrer
  if(ref){
    let referrer = users.find(u=>u.email===ref);
    if(referrer){
      referrer.balance += 100;
      referrer.referrals += 1;
    }
  }
  
  localStorage.setItem('users', JSON.stringify(users));
  alert('Registered! +100 CEL bonus');
  showTab('login');
}

function login(){
  let email = document.getElementById('loginEmail').value.toLowerCase();
  let password = document.getElementById('loginPassword').value;
  
  let users = JSON.parse(localStorage.getItem('users')) || [];
  let user = users.find(u=>u.email===email && u.password===password);
  
  if(!user) return alert('Invalid email or password');
  
  localStorage.setItem('currentUser', email); // THIS WAS MISSING
  window.location = 'dashboard.html';
}
</script>
</body>
</html>
