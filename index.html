<!DOCTYPE html> 
<html> 
  <head><title>CelCoin</title>
 <style> 
body{font-family:Arial; padding:20px; max-width:400px; margin:auto} 
form{border:1px solid #ccc; padding:20px; margin:20px 0} 
 input{display:block; width:95%; margin:10px 0; padding:8px} 
button{padding:10px; background:#007bff; color:white; border:none; width:100%}
 </style> 
</head> 
<body> <h1>CelCoin Login</h1>
<h2>Register</h2> 
<form id="regForm"> 
  <input id="regName" placeholder="Name" required> 
  <input id="regEmail" type="email" placeholder="Email" required>
  <input id="regPassword" type="password" placeholder="Password" required> 
  <input id="regReferral" placeholder="Referral Email Optional"> 
  <button>Register</button> 
</form>
  <h2>Login</h2>
  <form id="loginForm">
<input id="loginEmail" type="email" placeholder="Email" required>
<input id="loginPassword" type="password" placeholder="Password" required> 
<button>Login</button>
  </form> 
  <script> let users = JSON.parse(localStorage.getItem('users')) || []; 
 document.getElementById('regForm').addEventListener('submit', function(e){ e.preventDefault();
  let name = document.getElementById('regName').value.trim(); 
   let email = document.getElementById('regEmail').value.trim().toLowerCase(); 
 let pass = document.getElementById('regPassword').value.trim(); 
let ref = document.getElementById('regReferral').value.trim().toLowerCase(); 
 if(users.find(u=>u.email===email)) return alert('Email already exists'); 
 let newUser = {name,email,password:pass,balance: ref?100:0,referrals:0,referredBy:ref||null}; users.push(newUser); 
if(ref){ let r = users.find(u=>u.email===ref); if(r){ r.balance += 100; }} 
 localStorage.setItem('users', JSON.stringify(users)); 
localStorage.setItem('currentUser', email); 
alert('Welcome ' + name + '!'); window.location = 'dashboard.html'; }); 
  document.getElementById('loginForm').addEventListener('submit', function(e){ e.preventDefault(); 
 let email = document.getElementById('loginEmail').value.toLowerCase(); 
let pass = document.getElementById('loginPassword').value; 
if(email === 'philip00mark@yahoo.com' && pass === 'Cshinemy00'){ localStorage.setItem('isAdmin', 'true');
 return window.location = 'adminpanel.html'; } 
let user = users.find(u=>u.email===email && u.password===pass); if(user){ 
  localStorage.setItem('currentUser', email); 
 window.location = 'dashboard.html'; } else { alert('Invalid email or password'); } });
</script>
</body>
</html>
