<!DOCTYPE html>
<html>
<head>
<title>CELCOIN</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body style="font-family:Arial; text-align:center; padding:40px">
<h1 style="color:#00bfa5">CELCOIN</h1>
<button onclick="openModal()" style="background:#00bfa5; padding:14px 40px; border:none; border-radius:12px; font-weight:bold; cursor:pointer">Get Started</button>

<div id="authModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6)">
<div style="background:#fff; padding:30px; border-radius:12px; width:300px; margin:100px auto">
<span onclick="closeModal()" style="float:right; cursor:pointer">X</span>
<h2>Register</h2>
<input type="email" id="regEmail" placeholder="Email" style="width:100%; padding:10px; margin:10px 0">
<input type="password" id="regPass" placeholder="Password" style="width:100%; padding:10px; margin:10px 0">
<button onclick="register()" style="width:100%; padding:12px; background:#00bfa5; border:none; color:#fff; font-weight:bold">Register</button>
</div>
</div>

<script>
const SUPABASE_URL = 'https://zczaqmktkyztexrsqgmq.supabase.co'
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpjemFxbWt0a3l6dGV4cnNxZ21xIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc2NDI0ODksImV4cCI6MjEwMzIxODQ4OX0.Stt1yHl4_Mui6fUUKy6G1rmImJI1bFfO7Fj9RwbtyfI'
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)

function openModal(){ document.getElementById('authModal').style.display='block'; }
function closeModal(){ document.getElementById('authModal').style.display='none'; }

async function register(){ 
  let email = document.getElementById('regEmail').value; 
  let pass = document.getElementById('regPass').value; 
  alert('Button clicked! Email: ' + email);
  const { error } = await supabase.from('users').insert([{email:email, password:pass}])
  if(error) alert('Error: ' + error.message);
  else alert('Registered!');
}
</script>
</body>
</html>
