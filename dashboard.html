<!DOCTYPE html>
<html>
<head>
<title>CELCOIN Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
*{margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', Arial}
body{background:#f7f8fa; padding-bottom:40px}

/* HEADER */
header{display:flex; justify-content:space-between; align-items:center; padding:20px; background:#fff; box-shadow:0 2px 5px rgba(0,0,0,0.05)}
.logo{font-size:26px; font-weight:bold; font-style:italic}
.logo .cel{color:#6b7280}
.logo .coin{color:#00bfa5}
.btn-logout{background:#ef4444; color:#fff; border:none; padding:10px 20px; border-radius:10px; font-weight:bold; cursor:pointer}

/* CONTENT */
.container{padding:20px; max-width:600px; margin:auto}
.welcome{text-align:center; font-size:28px; font-weight:bold; margin:20px 0; color:#1a2b4b}
.welcome span{color:#00bfa5}

/* BALANCE CARD */
.balance-card{background:linear-gradient(135deg, #00bfa5 0%, #009688 100%); color:#fff; padding:30px; border-radius:20px; text-align:center; margin-bottom:20px}
.balance-card h2{font-size:16px; font-weight:400; opacity:0.9; margin-bottom:10px}
.balance-card h1{font-size:40px; font-weight:bold}

/* BOXES */
.box{background:#fff; padding:20px; border-radius:15px; margin-bottom:20px; box-shadow:0 4px 15px rgba(0,0,0,0.05)}
.box h3{display:flex; align-items:center; gap:10px; font-size:20px; margin-bottom:8px; color:#1a2b4b}
.box p{color:#555}
.btn{background:#00bfa5; color:#fff; border:none; padding:14px; width:100%; border-radius:10px; font-size:16px; font-weight:bold; cursor:pointer; margin-top:15px}
.btn:active{transform:scale(0.98)}
input{width:100%; padding:12px; border:1px solid #ddd; border-radius:8px; background:#f9f9f9; margin:10px 0}
.green-text{color:#00bfa5; text-align:center; font-weight:bold; margin-top:10px}
</style>
</head>
<body>

<header>
  <div class="logo"><span class="cel">CEL</span><span class="coin">COIN</span></div>
  <button class="btn-logout" onclick="logout()">Logout</button>
</header>

<div class="container">
  <h1 class="welcome">Welcome back, <span id="userName">H</span>!</h1>

  <div class="balance-card">
    <h2>Your CEL Balance</h2>
    <h1>CEL <span id="balance">0</span></h1>
  </div>

  <div class="box">
    <h3>⛏️ Mining</h3>
    <p>Earn <b>50 CEL</b> every 24 hours</p>
    <button class="btn" onclick="mine()">Mine 50 CEL</button>
    <div class="green-text" id="mineStatus">Ready to mine!</div>
  </div>

  <div class="box">
    <h3>👥 Referrals</h3>
    <p>Total Referred: <b id="refCount">0</b></p>
    <p><b>Your Referral Link:</b></p>
    <input type="text" id="refLink" readonly>
    <button class="btn" onclick="copyRef()">Copy Link</button>
  </div>
</div>

<script>
let currentUser = localStorage.getItem('currentUser');
let users = JSON.parse(localStorage.getItem('users')) || [];
let user = users.find(u => u.email === currentUser);

if(!user){
  alert('Please login first');
  window.location = 'index.html';
}

// LOAD DATA
document.getElementById('userName').innerText = user.name.charAt(0).toUpperCase();
document.getElementById('balance').innerText = user.balance || 0;
document.getElementById('refCount').innerText = user.referrals || 0;

// FIX: ENCODE EMAIL FOR URL
let refUrl = window.location.origin + '/index.html?ref=' + encodeURIComponent(currentUser);
document.getElementById('refLink').value = refUrl;

// MINING - 24hr cooldown
function mine(){
  let lastMine = localStorage.getItem('lastMine_' + currentUser);
  let now = new Date().getTime();
  let day = 24 * 60 * 60 * 1000;
  
  if(lastMine && (now - lastMine) < day){
    let hoursLeft = Math.ceil((day - (now - lastMine)) / 1000 / 60 / 60);
    document.getElementById('mineStatus').innerText = 'Come back in ' + hoursLeft + ' hours';
    return;
  }
  
  user.balance += 50;
  localStorage.setItem('lastMine_' + currentUser, now);
  saveUsers();
  document.getElementById('balance').innerText = user.balance;
  document.getElementById('mineStatus').innerText = 'Mined 50 CEL! Come back in 24hrs';
}

function copyRef(){
  let refInput = document.getElementById('refLink');
  refInput.select();
  refInput.setSelectionRange(0, 99999); // For mobile
  navigator.clipboard.writeText(refInput.value); // Better copy for mobile
  alert('Referral link copied!');
}

function logout(){
  localStorage.removeItem('currentUser');
  localStorage.removeItem('isAdmin');
  window.location = 'index.html';
}

function saveUsers(){
  let index = users.findIndex(u => u.email === currentUser);
  users[index] = user;
  localStorage.setItem('users', JSON.stringify(users));
}

// Check mining cooldown on load
window.onload = function(){
  let lastMine = localStorage.getItem('lastMine_' + currentUser);
  if(lastMine){
    let now = new Date().getTime();
    let day = 24 * 60 * 60 * 1000;
    if((now - lastMine) < day){
      let hoursLeft = Math.ceil((day - (now - lastMine)) / 1000 / 60 / 60);
      document.getElementById('mineStatus').innerText = 'Come back in ' + hoursLeft + ' hours';
    }
  }
}
</script>
